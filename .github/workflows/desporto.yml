name: Atualizar desporto

on:
  schedule:
    - cron: "22 * * * *"          # uma vez por hora, depois das passagens do radar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-desporto
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Recolher snapshot do radar
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
          RADAR_EVENTS_URL: ${{ vars.RADAR_EVENTS_URL }}
        run: python -m desporto.harvest
      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/desporto
          if git diff --cached --quiet; then
            echo "Sem alterações a guardar."
          else
            git commit -m "desporto: atualização automática"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Publica docs/ no GitHub Pages (o mesmo site dos concertos, que também
  # vive em docs/). Serializado com o workflow "Atualizar espetáculos"
  # através do grupo de concorrência "pages", como recomendado pela
  # actions/deploy-pages para evitar publicações a pisarem-se.
  publicar:
    needs: recolher
    continue-on-error: true
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
