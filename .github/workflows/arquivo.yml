name: Arquivo Desportivo

on:
  schedule:
    - cron: "22 * * * *"          # uma vez por hora, depois das passagens do radar
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arquivo-desportivo
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Recolher snapshot do radar
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
          RADAR_EVENTS_URL: ${{ vars.RADAR_EVENTS_URL }}
        run: python -m arquivo.harvest
      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados
          if git diff --cached --quiet; then
            echo "Sem alterações a guardar."
          else
            git commit -m "arquivo: actualização automática"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
